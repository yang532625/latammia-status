<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>We'll be back soon</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: linear-gradient(135deg, #10004f 0%, #1b0088 45%, #8a0a6a 75%, #e8114b 100%);
      color: #ffffff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      text-align: center;
    }
    main { width: min(640px, 100%); }
    p { margin: 0; }
    .main {
      font-size: clamp(22px, 4.2vw, 30px);
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }
    .other {
      margin-top: 22px;
      font-size: clamp(15px, 2.4vw, 18px);
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.78);
    }
    .other + .other { margin-top: 10px; }
  </style>
</head>
<body>
  <main>
    <p class="main" lang="es">Muchas gracias por usar este sitio web y por su apoyo. Esperamos estar de vuelta pronto.</p>
    <p class="other" lang="en">Thank you for using this website and for your support. We hope to be back soon.</p>
    <p class="other" lang="pt">Muito obrigado por usar este site e pelo seu apoio. Esperamos voltar em breve.</p>
  </main>
</body>
</html>
